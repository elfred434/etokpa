server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Vérification de santé pour Docker et les orchestrateurs.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Le HTML doit pouvoir récupérer les noms d’assets versionnés après déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite émet des assets nommés par hash : cache long et immuable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Repli SPA pour les routes client (TanStack Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
