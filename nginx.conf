server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-XBSfL6DR0hL7jVmIzje5Hw5dlo72nUHS3JW3WEvPozI='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.fedapay.com https://sandbox-checkout.fedapay.com; object-src 'none'" always;

    # Vérification de santé pour Docker et les orchestrateurs.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Le HTML doit pouvoir récupérer les noms d’assets versionnés après déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-XBSfL6DR0hL7jVmIzje5Hw5dlo72nUHS3JW3WEvPozI='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.fedapay.com https://sandbox-checkout.fedapay.com; object-src 'none'" always;
    }

    # Vite émet des assets nommés par hash : cache long et immuable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Repli SPA pour les routes client (TanStack Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
